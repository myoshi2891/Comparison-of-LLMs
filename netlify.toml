[build]
  # Next.js App Router (web-next/) を静的エクスポートとして配信する。
  # base を web-next に設定し、publish は base 相対で out ディレクトリを指す。
  base    = "web-next"
  # ビルドは Next.js 16 既定の Turbopack を使用する（bun run build = next build）。
  # --webpack へ切り替えないこと: webpack の css-loader は .module.css を pure モードで
  #   処理するため、:root / :global(...) をトップレベルに持つ page.module.css
  #   （codex/harness-engineering, google/agent-harness-engineering,
  #    google/antigravity-slash-commands-guide）が "selector is not pure" で全滅する。
  # --frozen-lockfile: Netlify はビルド間で node_modules をキャッシュするため、
  #   lockfile 通りに固定して再現性を確保する。
  # 参考（過去の失敗の記録）: Turbopack が next/font/google の仮想モジュール
  #   "@vercel/turbopack-next/internal/font/google/font" を 496 件解決できずに
  #   失敗していた原因は SWC バイナリ欠損ではなく、next/font が @font-face を
  #   全件ビルド時にダウンロードする挙動だった（Noto Sans JP = 124 slice ×
  #   4 weight = 496 本を fonts.gstatic.com から取得しようとして失敗）。
  #   現在は Noto Sans JP を web-next/public/fonts/ へ vendor 済みで、
  #   ビルド中に Google Fonts へアクセスしない（web-next/scripts/vendor-noto-sans-jp.ts）。
  command = "bun install --frozen-lockfile && bun run build"
  publish = "out"
  # base 配下に差分がない場合に Netlify がビルドを自動スキップする既定挙動を無効化する。
  # 理由: base 外にある netlify.toml（リダイレクト定義）や pricing.json の変更が
  #       反映されず、docs のみのコミットが "Deploy failed" として表示されるため。
  # ignore は終了コード 0 でスキップ・非 0 でビルド実行。/bin/false は常に 1 を返す。
  ignore  = "/bin/false"

[build.environment]
  # Netlify でのランタイム指定
  # - BUN_VERSION: web-next の依存解決・ビルドに使用
  # - NODE_VERSION: Next.js 16 は Node 20+ を要求 (Bun は Node ランタイムを代替しない)
  BUN_VERSION  = "1.3.9"
  NODE_VERSION = "20"

